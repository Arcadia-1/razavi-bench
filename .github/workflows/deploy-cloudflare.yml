name: Deploy Cloudflare Worker & Sync Data

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/worker
          command: deploy

      - name: Upload index.json to R2
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/analog-design-bench-data/objects/direct_qa/index.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@docs/data/direct_qa/index.json" \
            | tee /tmp/r2_upload.json
          if ! grep -q '"success":true' /tmp/r2_upload.json; then
            echo "R2 upload failed"
            cat /tmp/r2_upload.json
            exit 1
          fi

      - name: Upload tasks.jsonl to R2
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/analog-design-bench-data/objects/tasks/tasks.jsonl" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/x-ndjson" \
            --data-binary "@data/tasks.jsonl" \
            | tee /tmp/r2_tasks_upload.json
          if ! grep -q '"success":true' /tmp/r2_tasks_upload.json; then
            echo "R2 tasks.jsonl upload failed"
            cat /tmp/r2_tasks_upload.json
            exit 1
          fi

      - name: Regenerate per-question aggregate data
        run: node tools/aggregate_questions.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=razavi-bench --branch=main

