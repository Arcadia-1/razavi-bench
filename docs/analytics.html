<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Analytics — Razavi-Bench</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="Visit analytics for Razavi-Bench.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d13'/%3E%3Cpath d='M10 24.2V6.2h6.8a5 5 0 0 1 0 10H10M15.5 16.2l5.8 7.2' stroke='%2341e3a5' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='22.1' cy='24.3' r='2.3' fill='%2341e3a5'/%3E%3Ccircle cx='10' cy='24.8' r='2.3' fill='%2341e3a5'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    if (saved === "light" || (!saved && matchMedia("(prefers-color-scheme: light)").matches)) {
      document.documentElement.classList.add("light");
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
/* This page is Analog Design Bench's /analytics dashboard. assets/analytics.css is a verbatim
   copy of site/analytics/analytics.css there; the rules below stand in for the Tailwind
   preflight and the global theme that page inherits from site/src/index.css. */
*,::after,::before,::backdrop{box-sizing:border-box;margin:0;padding:0;border:0 solid}
:root{
  --font-sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Google Sans Code Variable","Google Sans Code",ui-monospace,"SF Mono",monospace;
  --color-bg:#0a0d13;--color-ink:#e9eef6;--color-accent:#41e3a5;
}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4;font-family:var(--font-sans);-webkit-tap-highlight-color:transparent;color-scheme:dark;scroll-behavior:smooth}
html.light{color-scheme:light;--color-bg:#f6f8fa;--color-ink:#17212e;--color-accent:#0c9f6e}
body{background-color:var(--color-bg);color:var(--color-ink);font-family:var(--font-sans);font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
a{color:inherit;-webkit-text-decoration:inherit;text-decoration:inherit}
code,kbd,samp,pre{font-family:var(--font-mono);font-size:1em}
table{text-indent:0;border-color:inherit;border-collapse:collapse}
ol,ul,menu{list-style:none}
img,svg,video,canvas,audio,iframe,embed,object{display:block;vertical-align:middle}
button,input,select,optgroup,textarea,::file-selector-button{font:inherit;font-feature-settings:inherit;font-variation-settings:inherit;letter-spacing:inherit;color:inherit;border-radius:0;background-color:transparent;opacity:1}
::-webkit-date-and-time-value{min-height:1lh;text-align:inherit}
::-webkit-datetime-edit{display:inline-flex}
::-webkit-datetime-edit-fields-wrapper{padding:0}
::-webkit-datetime-edit,::-webkit-datetime-edit-year-field,::-webkit-datetime-edit-month-field,::-webkit-datetime-edit-day-field,::-webkit-datetime-edit-hour-field,::-webkit-datetime-edit-minute-field,::-webkit-datetime-edit-second-field,::-webkit-datetime-edit-millisecond-field,::-webkit-datetime-edit-meridiem-field{padding-block:0}
button,input:where([type=button],[type=reset],[type=submit]),::file-selector-button{appearance:button}
[hidden]:where(:not([hidden=until-found])){display:none!important}
</style>
<link rel="stylesheet" href="assets/analytics.css">
</head>
<body>
<div class="analytics-shell">
  <header class="analytics-top-bar" aria-label="Page controls">
    <div class="analytics-top-bar-left">
      <button type="button" class="analytics-theme-switch" id="themeSwitch"></button>
    </div>
    <div class="analytics-top-bar-right">
      <a class="analytics-home" href="/">← Homepage</a>
    </div>
  </header>

  <main class="analytics-page" id="content">
    <div class="analytics-container">
      <header class="analytics-head">
        <h1>Analytics</h1>
        <p class="analytics-sub">First-party counts · UTC days · updated <time id="generatedAt">—</time></p>
      </header>

      <p class="analytics-error" id="analyticsError" hidden>Could not load analytics.</p>

      <dl class="analytics-metrics" aria-label="Totals">
        <div><dt>Unique visitors</dt><dd id="metricUv">—</dd></div>
        <div><dt>Page views</dt><dd id="metricPv">—</dd></div>
        <div><dt>Visitors today</dt><dd id="metricUvToday">—</dd></div>
        <div><dt>Views today</dt><dd id="metricPvToday">—</dd></div>
      </dl>

      <section class="analytics-section" aria-labelledby="analytics-map-h">
        <div class="analytics-section-head">
          <h2 id="analytics-map-h">Origins</h2>
          <div class="analytics-section-head-meta">
            <p class="analytics-note">≈1° request buckets</p>
            <span class="analytics-aside" aria-hidden="true">Map</span>
          </div>
        </div>
        <div class="analytics-map-frame">
          <svg class="analytics-map-svg" viewBox="0 0 3600 1420" role="img" aria-label="World heatmap of request origins">
            <defs>
              <radialGradient id="analytics-heat-gradient">
                <stop offset="0%" stop-opacity="0.85"/>
                <stop offset="55%" stop-opacity="0.35"/>
                <stop offset="100%" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect class="analytics-map-ocean" x="0" y="0" width="3600" height="1420"/>
            <g class="analytics-map-land" id="mapLand" aria-hidden="true"></g>
            <g class="analytics-map-heat" id="mapHeat"></g>
          </svg>
        </div>
      </section>

      <section class="analytics-section" aria-labelledby="analytics-chart-h">
        <div class="analytics-section-head">
          <h2 id="analytics-chart-h">Daily traffic</h2>
          <div class="analytics-section-head-meta">
            <ul class="analytics-legend" aria-hidden="true">
              <li><span class="analytics-swatch analytics-swatch--pv"></span>Views</li>
              <li><span class="analytics-swatch analytics-swatch--uv"></span>Visitors</li>
            </ul>
            <span class="analytics-aside" id="rangeDays" aria-hidden="true">90 days</span>
          </div>
        </div>
        <form class="analytics-range" id="rangeForm">
          <label class="analytics-range-field">
            <span>From</span>
            <input class="analytics-range-input" type="date" name="from" id="rangeFrom" required>
          </label>
          <label class="analytics-range-field">
            <span>To</span>
            <input class="analytics-range-input" type="date" name="to" id="rangeTo" required>
          </label>
          <button type="button" class="analytics-range-reset" id="rangeReset">Last 90 days</button>
          <span class="analytics-range-hint">UTC</span>
        </form>
        <svg class="analytics-chart" id="dailyChart" viewBox="0 0 900 220" role="img" aria-label="Daily page views and unique visitors"></svg>
      </section>

      <div class="analytics-cols">
        <section class="analytics-section" aria-labelledby="analytics-countries-h">
          <div class="analytics-section-head">
            <h2 id="analytics-countries-h">ISO 3166 Code</h2>
            <div class="analytics-section-head-meta"><span class="analytics-aside" aria-hidden="true">Top</span></div>
          </div>
          <div class="analytics-breakdown" id="breakdown-countries"></div>
        </section>
        <section class="analytics-section" aria-labelledby="analytics-sources-h">
          <div class="analytics-section-head">
            <h2 id="analytics-sources-h">Sources</h2>
            <div class="analytics-section-head-meta"><span class="analytics-aside" aria-hidden="true">Top</span></div>
          </div>
          <div class="analytics-breakdown" id="breakdown-sources"></div>
        </section>
        <section class="analytics-section analytics-section--wide" aria-labelledby="analytics-pages-h">
          <div class="analytics-section-head">
            <h2 id="analytics-pages-h">Pages</h2>
            <div class="analytics-section-head-meta"><span class="analytics-aside" aria-hidden="true">Top</span></div>
          </div>
          <div class="analytics-breakdown" id="breakdown-pages"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script>
// A plain-script port of Analog Design Bench's site/analytics/AnalyticsPage.tsx, reading the
// same summary shape from this site's /api/analytics.
(function () {
  var DEFAULT_RANGE_DAYS = 90;
  var DEFAULT_BREAKDOWN_ROWS = 10;
  var WORLD_BOUNDS = { west: -180, east: 180, south: -58, north: 84 };
  // The map's viewBox is MAP_W by MAP_H: ten units per degree.
  var MAP_W = 3600;
  var MAP_H = Math.round(MAP_W * ((WORLD_BOUNDS.north - WORLD_BOUNDS.south) / (WORLD_BOUNDS.east - WORLD_BOUNDS.west)));
  var ANALYTICS_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    ? "http://127.0.0.1:8788/api/analytics"
    : "https://razavi-bench.tokenzhang.com/api/analytics";
  var fmt = new Intl.NumberFormat("en");

  var SOURCE_LABELS = {
    "direct-or-unknown": "Direct / unknown",
    "search:google": "Google Search",
    "search:bing": "Bing Search",
    "search:baidu": "Baidu Search",
    "search:duckduckgo": "DuckDuckGo Search",
    "search:yahoo": "Yahoo Search",
    "search:yandex": "Yandex Search",
    "search:ecosia": "Ecosia Search",
    "search:naver": "Naver Search",
    "search:sogou": "Sogou Search",
    "search:360": "360 Search",
    "social:wechat": "WeChat",
    "social:linkedin": "LinkedIn",
    "social:x": "X / Twitter",
    "social:facebook": "Facebook",
    "social:instagram": "Instagram",
    "social:reddit": "Reddit",
    "social:github": "GitHub",
    "social:zhihu": "Zhihu",
    "social:bilibili": "Bilibili",
    "social:xiaohongshu": "Xiaohongshu",
    "campaign:email": "Email / newsletter",
    "campaign:qr": "QR code",
    "campaign:rss": "RSS",
    "campaign:other": "Other campaign",
    "ref:other": "Other website",
    __other__: "Other sources"
  };

  var MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.3A8.5 8.5 0 0 1 9.7 3a7 7 0 1 0 11.3 11.3Z"/></svg>';
  var SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';

  var state = { summary: null, error: false, from: "", to: "" };
  var breakdowns = {
    countries: { heading: "Region", rows: "countries", expanded: false, mono: false, label: function (row) { return countryName(row.code); } },
    sources: { heading: "Source", rows: "sources", expanded: false, mono: false, label: function (row) { return sourceName(row.source); } },
    pages: { heading: "Path", rows: "paths", expanded: false, mono: true, label: function (row) { return row.path === "__other__" ? "Other pages" : row.path; } }
  };

  function $(id) { return document.getElementById(id); }
  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }
  function shiftUtcDay(iso, delta) {
    var date = new Date(iso + "T00:00:00.000Z");
    date.setUTCDate(date.getUTCDate() + delta);
    return date.toISOString().slice(0, 10);
  }
  function dayCount(from, to) {
    var start = Date.parse(from + "T00:00:00.000Z");
    var end = Date.parse(to + "T00:00:00.000Z");
    if (!isFinite(start) || !isFinite(end) || end < start) return 0;
    return Math.round((end - start) / 86400000) + 1;
  }
  function rowMetrics(row) {
    return { pv: row.pv != null ? row.pv : row.count != null ? row.count : 0, uv: row.uv != null ? row.uv : 0 };
  }
  function countryName(code) {
    if (code === "__other__") return "Other regions";
    if (code === "T1") return "Tor network";
    if (code === "XX") return "Unknown";
    try {
      return new Intl.DisplayNames(["en"], { type: "region" }).of(code) || code;
    } catch (e) {
      return code;
    }
  }
  function sourceName(source) {
    return SOURCE_LABELS[source] || (source.indexOf("ref:") === 0 ? source.slice(4) : source);
  }

  // ==== THEME ====
  function theme() { return document.documentElement.classList.contains("light") ? "light" : "dark"; }
  function renderThemeSwitch() {
    var label = theme() === "dark" ? "Switch to light theme" : "Switch to dark theme";
    var button = $("themeSwitch");
    button.setAttribute("aria-label", label);
    button.title = label;
    button.innerHTML = theme() === "dark" ? SUN_ICON : MOON_ICON;
  }
  $("themeSwitch").addEventListener("click", function () {
    var next = theme() === "dark" ? "light" : "dark";
    document.documentElement.classList.toggle("light", next === "light");
    try { localStorage.setItem("theme", next); } catch (e) {}
    renderThemeSwitch();
  });
  renderThemeSwitch();

  // ==== WORLD MAP ====
  function ringToPath(ring, width, height) {
    if (ring.length < 2) return "";
    var path = "";
    for (var i = 0; i < ring.length; i++) {
      var x = ((ring[i][0] - WORLD_BOUNDS.west) / (WORLD_BOUNDS.east - WORLD_BOUNDS.west)) * width;
      var y = ((WORLD_BOUNDS.north - ring[i][1]) / (WORLD_BOUNDS.north - WORLD_BOUNDS.south)) * height;
      path += (i === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2);
    }
    return path + "Z";
  }
  // The same coastline-only equirectangular world as site/analytics/worldMap.ts.
  function landPathsForWorld(land, width, height) {
    var paths = [];
    land.features.forEach(function (feature) {
      var geometry = feature.geometry;
      if (!geometry) return;
      var polygons = geometry.type === "Polygon" ? [geometry.coordinates] : geometry.coordinates;
      polygons.forEach(function (polygon) {
        if (!polygon[0]) return;
        var path = ringToPath(polygon[0], width, height);
        for (var i = 1; i < polygon.length; i++) path += ringToPath(polygon[i], width, height);
        if (path) paths.push(path);
      });
    });
    return paths;
  }
  fetch("assets/land-110m.json")
    .then(function (response) { return response.json(); })
    .then(function (land) {
      $("mapLand").innerHTML = landPathsForWorld(land, MAP_W, MAP_H).map(function (d) { return '<path d="' + d + '"/>'; }).join("");
    })
    .catch(function () {});

  function renderHeat(points) {
    var maxCount = points.reduce(function (max, point) { return Math.max(max, point.count); }, 1);
    $("mapHeat").innerHTML = points.map(function (point) {
      var cx = (point.lng + 180) * 10;
      var cy = (84 - point.lat) * 10;
      var radius = 18 + 64 * Math.sqrt(point.count / maxCount);
      var title = "<title>" + esc(fmt.format(point.count) + " views near " + point.lat + ", " + point.lng) + "</title>";
      return '<g><circle class="analytics-heat-blob" cx="' + cx + '" cy="' + cy + '" r="' + radius + '">' + title + "</circle>"
        + '<circle class="analytics-heat-core" cx="' + cx + '" cy="' + cy + '" r="' + Math.max(2.8, radius * 0.09) + '">' + title + "</circle></g>";
    }).join("");
  }

  // ==== DAILY TRAFFIC ====
  function renderDailyChart(days) {
    var width = 900, height = 220, padTop = 16, padBottom = 22, padX = 2;
    var plotHeight = height - padTop - padBottom;
    if (!days.length) {
      $("dailyChart").innerHTML = '<text class="analytics-chart-tick" x="' + width / 2 + '" y="' + height / 2 + '" text-anchor="middle">No days in this range</text>';
      return;
    }
    var max = days.reduce(function (m, day) { return Math.max(m, day.pv); }, 1);
    var slot = (width - padX * 2) / days.length;
    var ticks = days.length === 1
      ? [{ index: 0, x: width / 2, anchor: "middle" }]
      : days.length === 2
        ? [{ index: 0, x: 0, anchor: "start" }, { index: 1, x: width, anchor: "end" }]
        : [
            { index: 0, x: 0, anchor: "start" },
            { index: Math.floor(days.length / 2), x: width / 2, anchor: "middle" },
            { index: days.length - 1, x: width, anchor: "end" }
          ];
    var parts = days.map(function (day, index) {
      var pvHeight = (day.pv / max) * plotHeight;
      var uvHeight = (day.uv / max) * plotHeight;
      var x = padX + index * slot;
      var title = "<title>" + day.date + ": " + fmt.format(day.pv) + " views, " + fmt.format(day.uv) + " visitors</title>";
      var bars = '<rect class="analytics-chart-bar-pv" x="' + (x + slot * 0.18) + '" y="' + (height - padBottom - pvHeight)
        + '" width="' + slot * 0.64 + '" height="' + Math.max(pvHeight, day.pv > 0 ? 1.25 : 0) + '">' + title + "</rect>";
      if (day.uv > 0) {
        bars += '<rect class="analytics-chart-bar-uv" x="' + (x + slot * 0.34) + '" y="' + (height - padBottom - uvHeight)
          + '" width="' + slot * 0.32 + '" height="' + Math.max(uvHeight, 1.25) + '">' + title + "</rect>";
      }
      return "<g>" + bars + "</g>";
    });
    parts.push('<line class="analytics-chart-axis" x1="0" x2="' + width + '" y1="' + (height - padBottom) + '" y2="' + (height - padBottom) + '"/>');
    parts.push('<text class="analytics-chart-tick" x="0" y="' + (padTop - 2) + '">' + fmt.format(max) + "</text>");
    ticks.forEach(function (tick) {
      parts.push('<text class="analytics-chart-tick" x="' + tick.x + '" y="' + (height - 4) + '" text-anchor="' + tick.anchor + '">' + days[tick.index].date.slice(5) + "</text>");
    });
    $("dailyChart").innerHTML = parts.join("");
  }
  function renderRange() {
    var from = state.from, to = state.to, visible = [];
    if (state.summary && from && to) {
      var start = from < to ? from : to, end = from < to ? to : from;
      visible = state.summary.days.filter(function (day) { return day.date >= start && day.date <= end; });
    }
    var rangeDays = from && to ? dayCount(from < to ? from : to, from < to ? to : from) : 90;
    $("rangeDays").textContent = rangeDays === 1 ? "1 day" : rangeDays + " days";
    renderDailyChart(visible);
  }
  // The last 90 days of data, or all of it when there is less.
  function defaultRange() {
    var days = state.summary && state.summary.days;
    if (!days || !days.length) return false;
    var end = days[days.length - 1].date, earliest = days[0].date;
    var start = shiftUtcDay(end, -(DEFAULT_RANGE_DAYS - 1));
    state.from = start < earliest ? earliest : start;
    state.to = end;
    return true;
  }
  function resetRange() {
    if (!defaultRange()) return;
    $("rangeFrom").value = state.from;
    $("rangeTo").value = state.to;
    renderRange();
  }
  $("rangeForm").addEventListener("submit", function (event) { event.preventDefault(); });
  $("rangeFrom").addEventListener("input", function (event) { state.from = event.target.value; renderRange(); });
  $("rangeTo").addEventListener("input", function (event) { state.to = event.target.value; renderRange(); });
  $("rangeReset").addEventListener("click", resetRange);

  // ==== BREAKDOWN TABLES ====
  function metricCell(value, total) {
    var percentage = total > 0 ? (value / total) * 100 : 0;
    return '<td class="num analytics-metric"><span>' + fmt.format(value) + '</span><span class="analytics-metric-distribution">' + percentage.toFixed(1) + "%</span></td>";
  }
  function chevron(expanded) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'
      + (expanded ? ' class="is-expanded"' : "") + '><path d="m7 10 5 5 5-5"/></svg>';
  }
  function renderBreakdown(name) {
    var table = breakdowns[name], summary = state.summary;
    var rows = summary ? summary[table.rows] : [];
    var total = summary ? summary.breakdownTotals[name] : { pv: 0, uv: 0 };
    var loading = !summary && !state.error;
    var tableId = "analytics-table-" + name;
    var body;
    if (loading || state.error || !rows.length) {
      body = '<tr><td colspan="3" class="analytics-empty">' + (loading ? "Loading…" : state.error ? "Unavailable." : "No data yet.") + "</td></tr>";
    } else {
      body = (table.expanded ? rows : rows.slice(0, DEFAULT_BREAKDOWN_ROWS)).map(function (row) {
        var metric = rowMetrics(row);
        return "<tr><td" + (table.mono ? ' class="mono"' : "") + ">" + esc(table.label(row)) + "</td>"
          + metricCell(metric.uv, total.uv) + metricCell(metric.pv, total.pv) + "</tr>";
      }).join("");
    }
    var html = '<div class="analytics-table-scroll"><table class="analytics-table" id="' + tableId + '"><thead><tr>'
      + '<th scope="col">' + table.heading + '</th><th scope="col" class="num">Unique Visitors</th><th scope="col" class="num">Page Views</th>'
      + "</tr></thead><tbody>" + body + "</tbody></table></div>";
    if (rows.length > DEFAULT_BREAKDOWN_ROWS) {
      html += '<button type="button" class="analytics-table-toggle" aria-controls="' + tableId + '" aria-expanded="' + table.expanded + '"><span>'
        + (table.expanded ? "Show top " + DEFAULT_BREAKDOWN_ROWS : "Show all " + rows.length) + "</span>" + chevron(table.expanded) + "</button>";
    }
    var box = $("breakdown-" + name);
    box.innerHTML = html;
    var toggle = box.querySelector(".analytics-table-toggle");
    if (toggle) toggle.addEventListener("click", function () { table.expanded = !table.expanded; renderBreakdown(name); });
  }

  // ==== PAGE ====
  function render() {
    var summary = state.summary;
    if (summary) {
      $("generatedAt").setAttribute("datetime", summary.generatedAt);
      $("generatedAt").textContent = new Date(summary.generatedAt).toLocaleString("en", { dateStyle: "medium", timeStyle: "short" });
      $("metricUv").textContent = fmt.format(summary.totals.uv);
      $("metricPv").textContent = fmt.format(summary.totals.pv);
      $("metricUvToday").textContent = fmt.format(summary.today.uv);
      $("metricPvToday").textContent = fmt.format(summary.today.pv);
      renderHeat(summary.points || []);
      if (summary.days.length) {
        $("rangeFrom").min = $("rangeTo").min = summary.days[0].date;
        $("rangeFrom").max = $("rangeTo").max = summary.days[summary.days.length - 1].date;
      }
      $("rangeFrom").value = state.from;
      $("rangeTo").value = state.to;
    }
    $("analyticsError").hidden = !state.error;
    renderRange();
    Object.keys(breakdowns).forEach(renderBreakdown);
  }
  render();
  fetch(ANALYTICS_URL, { headers: { Accept: "application/json" } })
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(function (data) {
      state.summary = data;
      defaultRange();
      render();
    })
    .catch(function () {
      state.error = true;
      render();
    });
})();
</script>
</body>
</html>
